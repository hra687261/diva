
name: Nix

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Cache Lean and the dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: nix-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Build
        run: nix develop --command lake build
      - name: Test
        run: nix develop --command lake test
